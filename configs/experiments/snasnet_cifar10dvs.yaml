seed: 2025
device: auto
output_dir: runs/snasnet_cifar10dvs
dataset:
  name: cifar10dvs
  root: data
  timesteps: 10
  image_size: 32
  batch_size: 16
  workers: 4
  download: true
model:
  search_space: snasnet
  architecture: null
  width: 128
  tau: 1.3333333333
  threshold: 1.0
  surrogate_alpha: 2.0
proxy:
  name: lle
  batches: 1
  repeats: 1
  probes: 1
  warmup_steps: 1
  epsilon: 1.0e-8
search:
  method: random
  candidates: 2000
  timesteps: [2, 4, 6, 8, 10, 12, 14]
training:
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0005
  optimizer: sgd
  momentum: 0.9
