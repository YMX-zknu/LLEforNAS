[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l-nas"
version = "1.1.0"
description = "FTLE proxy and joint architecture and timestep search for SNNs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.12"
authors = [
  {name = "Mingxuan Yang"},
  {name = "Xiaojun Wu"},
  {name = "Michael Yu Wang"},
]
dependencies = [
  "numpy>=1.24,<2",
  "torch>=2.3,<2.6",
]

[project.optional-dependencies]
events = ["spikingjelly==0.0.0.0.12"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lnas = "lnas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035"]

[tool.ruff.lint.isort]
known-first-party = ["lnas"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
